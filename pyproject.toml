[project]
name = "gr2mini"
version = "0.1.0"
description = "Single-GPU, from-scratch re-implementation of GR2: Generative Reasoning Re-ranker (arXiv:2602.07774)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["gr2mini"]
# Integration tests download models or need a GPU. Run them explicitly with:  python -m pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: downloads models/data or needs a GPU (deselected by default)",
]
